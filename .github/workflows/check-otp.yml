name: OTP adatbazis automatikus frissites

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:

      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python csomag telepitese
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pypdf

      - name: OTP adatbazis frissitese
        run: |
          python3 <<'PY'
          import json
          import re
          import urllib.request
          from pypdf import PdfReader

          OTP_URL = "https://www.otpbank.hu/portal/hu/megtakaritas/forint-betetek/gepkocsinyeremeny"
          JSON_FILE = "WinnerData.json"
          PDF_FILE = "latest_otp.pdf"

          print("========================================")
          print("GKnyero - OTP automatikus frissites")
          print("========================================")
          print()

          # --------------------------------------------------
          # 1. WinnerData.json betoltese
          # --------------------------------------------------

          with open(JSON_FILE, "r", encoding="utf-8") as f:
              database = json.load(f)

          draws = database.get("draws", [])

          existing_draw_dates = {
              draw.get("drawDate")
              for draw in draws
          }

          existing_numbers = set()

          for draw in draws:
              for number in draw.get("numbers", []):
                  existing_numbers.add(number)

          print("Meglevo sorsolasok:", len(draws))
          print("Meglevo nyertes szamok:", len(existing_numbers))
          print()

          # --------------------------------------------------
          # 2. OTP oldal letoltese
          # --------------------------------------------------

          request = urllib.request.Request(
              OTP_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("OTP oldal sikeresen letoltve.")
          print()

          # --------------------------------------------------
          # 3. OTP PDF linkek megkeresese
          # --------------------------------------------------

          pdf_links = re.findall(
              r'href=["\']([^"\']*GK_[0-9]{8}\.pdf)["\']',
              html,
              re.IGNORECASE
          )

          if not pdf_links:
              raise Exception(
                  "Nem talaltam OTP sorsolasi PDF-et."
              )

          # Relativ linkekbol teljes URL
          normalized_links = []

          for link in pdf_links:

              if link.startswith("http"):
                  full_url = link
              else:
                  full_url = (
                      "https://www.otpbank.hu"
                      + (
                          link
                          if link.startswith("/")
                          else "/" + link
                      )
                  )

              normalized_links.append(full_url)

          # Duplicalt linkek kiszedese
          normalized_links = list(
              dict.fromkeys(normalized_links)
          )

          # A legfrissebb PDF datuma
          def pdf_date(url):

              match = re.search(
                  r"GK_(\d{8})\.pdf",
                  url,
                  re.IGNORECASE
              )

              if not match:
                  return "00000000"

              return match.group(1)

          normalized_links.sort(
              key=pdf_date,
              reverse=True
          )

          latest_pdf_url = normalized_links[0]

          print(
              "Legfrissebb OTP PDF:",
              latest_pdf_url
          )

          print()

          # --------------------------------------------------
          # 4. PDF letoltese
          # --------------------------------------------------

          pdf_request = urllib.request.Request(
              latest_pdf_url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              pdf_request,
              timeout=30
          ) as response:

              pdf_data = response.read()

          with open(PDF_FILE, "wb") as f:
              f.write(pdf_data)

          print("PDF letoltve.")
          print()

          # --------------------------------------------------
          # 5. PDF szovegenek kiolvasasa
          # --------------------------------------------------

          reader = PdfReader(PDF_FILE)

          pdf_text = ""

          for page in reader.pages:

              page_text = page.extract_text()

              if page_text:
                  pdf_text += "\n" + page_text

          # --------------------------------------------------
          # 6. Sorsolas datumának kinyerese
          # --------------------------------------------------

          date_match = re.search(
              r"(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.\s*"
              r"(?:megtartott|megtartottan)",
              pdf_text,
              re.IGNORECASE
          )

          if not date_match:

              date_match = re.search(
                  r"(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\.",
                  pdf_text
              )

          if not date_match:

              raise Exception(
                  "Nem sikerult kinyerni a sorsolas datumat a PDF-bol."
              )

          year = date_match.group(1)
          month = int(date_match.group(2))
          day = int(date_match.group(3))

          draw_date = (
              f"{year}-{month:02d}-{day:02d}"
          )

          print(
              "Sorsolas datuma:",
              draw_date
          )

          # --------------------------------------------------
          # 7. Sorsolas szamanak kinyerese
          # --------------------------------------------------

          draw_number_match = re.search(
              r"(?:jegyzek|sorsolas)\s+(\d{3})\.",
              pdf_text,
              re.IGNORECASE
          )

          if not draw_number_match:

              draw_number_match = re.search(
                  r"(\d{3})\.",
                  pdf_text
              )

          draw_number = (
              draw_number_match.group(1)
              if draw_number_match
              else "?"
          )

          print(
              "Sorsolas szama:",
              draw_number
          )

          # --------------------------------------------------
          # 8. Nyertes betetkonyvszamok keresese
          # --------------------------------------------------

          matches = re.findall(
              r"\b(\d{2})\s+(\d{7})\b",
              pdf_text
          )

          numbers = []

          for prefix, number in matches:

              full_number = prefix + number

              if full_number not in numbers:

                  numbers.append(full_number)

          # Egy normal sorsolasnal 6 szamot varunk.
          # Ha nem 6, NEM irjuk at az adatbazist.

          if len(numbers) < 6:

              raise Exception(
                  "Nem talaltam legalabb 6 nyertes betetkonyvet. "
                  f"Talalt: {len(numbers)}"
              )

          numbers = numbers[:6]

          print()
          print("Nyertes szamok:")

          for number in numbers:
              print("  ", number)

          print()

          # --------------------------------------------------
          # 9. Ellenorzes: mar szerepel-e?
          # --------------------------------------------------

          if draw_date in existing_draw_dates:

              print(
                  "Ez a sorsolas mar szerepel az adatbazisban."
              )

              print("Nincs modositas.")

          else:

              print(
                  "UJ SORSOLAS TALALHATO!"
              )

              new_draw = {
                  "drawDate": draw_date,
                  "numbers": numbers
              }

              draws.append(new_draw)

              # Datum szerinti rendezes
              draws.sort(
                  key=lambda item: item.get(
                      "drawDate",
                      ""
                  )
              )

              database["draws"] = draws

              database["version"] = draw_date[:7]

              # ------------------------------------------------
              # 10. JSON mentese
              # ------------------------------------------------

              with open(
                  JSON_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      database,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print()
              print(
                  "WinnerData.json frissitve."
              )

          print()
          print("========================================")
          print("FOLYAMAT BEFEJEZVE")
          print("========================================")
          PY

      - name: Valtozasok ellenorzese
        run: |
          git status --short

      - name: Adatbazis commit es push
        run: |

          if git diff --quiet WinnerData.json; then

            echo "Nincs uj sorsolas."
            echo "Nem keszul commit."

          else

            git config user.name "GKnyero Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add WinnerData.json

            git commit -m "Automatikus OTP adatbazis frissites"

            git push

          fi
