name: OTP adatbazis ellenorzes

on:
  workflow_dispatch:

jobs:
  check-otp:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: OTP oldal ellenorzese
        run: |
          python3 <<'PY'
          import re
          import urllib.request

          url = "https://www.otpbank.hu/portal/hu/megtakaritas/forint-betetek/gepkocsinyeremeny"

          print("========================================")
          print("GKnyero - OTP automatikus ellenorzes")
          print("========================================")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="ignore")

          print()
          print("OTP oldal sikeresen letoltve.")
          print()

          draws = re.findall(
              r"(\d+)\.\s*sorsolas",
              html,
              re.IGNORECASE
          )

          print("Talalt sorsolasok:", draws)
          print()

          numbers = re.findall(
              r"\b(\d{2})\s+(\d{7})\b",
              html
          )

          numbers = list(
              dict.fromkeys(
                  prefix + number
                  for prefix, number in numbers
              )
          )

          numbers = numbers[:6]

          print("OTP altal talalt nyertes szamok:")
          print()

          for number in numbers:
              print("  " + number)

          print()
          print("Talalt szamok szama:", len(numbers))
          print()

          print("========================================")
          print("TESZT BEFEJEZVE")
          print("========================================")
          print("A WinnerData.json meg NEM valtozott.")
          print("========================================")
          PY
