name: OTP adatbazis automatikus frissites

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:

      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python csomag telepitese
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pypdf

      - name: OTP adatbazis frissitese
        run: |
          python3 <<'PY'
          import json
          import re
          import urllib.request
          from pypdf import PdfReader

          OTP_URL = "https://www.otpbank.hu/portal/hu/megtakaritas/forint-betetek/gepkocsinyeremeny"
          JSON_FILE = "WinnerData.json"

          print("========================================")
          print("GKnyero - OTP automatikus frissites")
          print("========================================")
          print()

          # ========================================
          # WinnerData.json betoltese
          # ========================================

          with open(JSON_FILE, "r", encoding="utf-8") as f:
              database = json.load(f)

          draws = database.get("draws", [])

          existing_dates = {
              draw.get("drawDate")
              for draw in draws
          }

          existing_numbers = set()

          for draw in draws:
              for number in draw.get("numbers", []):
                  existing_numbers.add(number)

          print("Meglevo sorsolasok:", len(draws))
          print("Meglevo nyertes szamok:", len(existing_numbers))
          print()

          # ========================================
          # OTP oldal letoltese
          # ========================================

          request = urllib.request.Request(
              OTP_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("OTP oldal sikeresen letoltve.")
          print()

          # ========================================
          # NORMAL + EXTRA PDF linkek keresese
          # ========================================

          pdf_links = re.findall(
              r'href=["\']([^"\']*GK_[0-9]{8}(?:_extra)?\.pdf)["\']',
              html,
              re.IGNORECASE
          )

          if not pdf_links:
              raise Exception(
                  "Nem talaltam OTP sorsolasi PDF-eket."
              )

          normalized_links = []

          for link in pdf_links:

              if link.startswith("http"):
                  full_url = link
              else:
                  full_url = (
                      "https://www.otpbank.hu"
                      + (
                          link
                          if link.startswith("/")
                          else "/" + link
                      )
                  )

              if full_url not in normalized_links:
                  normalized_links.append(full_url)

          # ========================================
          # PDF-ek rendezese datum szerint
          # ========================================

          def get_pdf_sort_key(url):

              match = re.search(
                  r"GK_(\d{8})(?:_extra)?\.pdf",
                  url,
                  re.IGNORECASE
              )

              if not match:
                  return "00000000"

              return match.group(1)

          normalized_links.sort(
              key=get_pdf_sort_key
          )

          print(
              "Talalt OTP PDF-ek:",
              len(normalized_links)
          )
          print()

          # ========================================
          # MINDEN PDF ellenorzese
          # ========================================

          new_draws = 0

          for pdf_url in normalized_links:

              print("----------------------------------------")
              print("PDF ellenorzese:")
              print(pdf_url)
              print()

              # ------------------------------------
              # Datum kinyerese a fajlnevbol
              # ------------------------------------

              date_match = re.search(
                  r"GK_(\d{4})(\d{2})(\d{2})(_extra)?\.pdf",
                  pdf_url,
                  re.IGNORECASE
              )

              if not date_match:

                  print(
                      "Nem sikerult datumot kinyerni."
                  )

                  continue

              year = date_match.group(1)
              month = date_match.group(2)
              day = date_match.group(3)
              extra = date_match.group(4)

              draw_date = (
                  f"{year}-{month}-{day}"
              )

              if extra:
                  draw_date += " EXTRA"

              print(
                  "Sorsolas:",
                  draw_date
              )

              # ------------------------------------
              # Ha mar szerepel, nem kell letolteni
              # ------------------------------------

              if draw_date in existing_dates:

                  print(
                      "Ez a sorsolas mar szerepel."
                  )

                  continue

              # ------------------------------------
              # PDF letoltese
              # ------------------------------------

              try:

                  pdf_request = urllib.request.Request(
                      pdf_url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      pdf_request,
                      timeout=30
                  ) as response:

                      pdf_data = response.read()

              except Exception as error:

                  print(
                      "PDF letoltesi hiba:",
                      error
                  )

                  continue

              # ------------------------------------
              # PDF ideiglenes mentese
              # ------------------------------------

              pdf_file = "latest_otp.pdf"

              with open(
                  pdf_file,
                  "wb"
              ) as f:

                  f.write(pdf_data)

              print(
                  "PDF sikeresen letoltve."
              )

              # ------------------------------------
              # PDF szoveg kiolvasasa
              # ------------------------------------

              try:

                  reader = PdfReader(
                      pdf_file
                  )

                  pdf_text = ""

                  for page in reader.pages:

                      page_text = page.extract_text()

                      if page_text:
                          pdf_text += "\n" + page_text

              except Exception as error:

                  print(
                      "PDF olvasasi hiba:",
                      error
                  )

                  continue

              # ------------------------------------
              # Nyertes szamok keresese
              # ------------------------------------

              matches = re.findall(
                  r"\b(\d{2})\s+(\d{7})\b",
                  pdf_text
              )

              numbers = []

              for prefix, number in matches:

                  full_number = (
                      prefix + number
                  )

                  if full_number not in numbers:

                      numbers.append(
                          full_number
                      )

              # ------------------------------------
              # Ellenorzes
              # ------------------------------------

              print()
              print(
                  "PDF-ben talalt szamok:"
              )

              for number in numbers:

                  print(
                      "  ",
                      number
                  )

              print()

              # ------------------------------------
              # Normal sorsolas = legalabb 6
              # Extra = legalabb 1
              # ------------------------------------

              if extra:

                  if len(numbers) < 1:

                      print(
                          "Az Extra PDF-ben nem "
                          "talaltam nyertes szamot."
                      )

                      continue

              else:

                  if len(numbers) < 6:

                      print(
                          "A normal PDF-ben nem "
                          "talaltam 6 nyertes szamot."
                      )

                      continue

                  numbers = numbers[:6]

              # ------------------------------------
              # UJ SORSOLAS
              # ------------------------------------

              print(
                  "UJ SORSOLAS TALALHATO!"
              )

              print(
                  "Datum:",
                  draw_date
              )

              print(
                  "Nyertes szamok:"
              )

              for number in numbers:

                  print(
                      "  ",
                      number
                  )

              new_draw = {
                  "drawDate": draw_date,
                  "numbers": numbers
              }

              draws.append(
                  new_draw
              )

              existing_dates.add(
                  draw_date
              )

              new_draws += 1

              print()

          # ========================================
          # Sorsolasok datum szerinti rendezese
          # ========================================

          def sort_draws(draw):

              date_text = draw.get(
                  "drawDate",
                  ""
              )

              match = re.match(
                  r"(\d{4}-\d{2}-\d{2})",
                  date_text
              )

              if match:
                  return match.group(1)

              return date_text

          draws.sort(
              key=sort_draws
          )

          database["draws"] = draws

          # ========================================
          # Version frissitese
          # ========================================

          if draws:

              latest_draw = max(
                  draws,
                  key=sort_draws
              )

              latest_date = latest_draw.get(
                  "drawDate",
                  ""
              )

              date_match = re.match(
                  r"(\d{4}-\d{2})",
                  latest_date
              )

              if date_match:

                  database["version"] = (
                      date_match.group(1)
                  )

          # ========================================
          # WinnerData.json mentese
          # ========================================

          if new_draws > 0:

              with open(
                  JSON_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      database,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print()
              print(
                  "WinnerData.json frissitve."
              )

              print(
                  "Uj sorsolasok:",
                  new_draws
              )

          else:

              print()
              print(
                  "Nem talaltam uj sorsolast."
              )

              print(
                  "A WinnerData.json nem valtozott."
              )

          print()
          print("========================================")
          print("FOLYAMAT BEFEJEZVE")
          print("========================================")
          PY

      - name: Valtozasok ellenorzese
        run: |
          git status --short

      - name: Adatbazis commit es push
        run: |

          if git diff --quiet WinnerData.json; then

            echo "Nincs uj adat."
            echo "Nem keszul commit."

          else

            git config user.name "GKnyero Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add WinnerData.json

            git commit -m "Automatikus OTP adatbazis frissites"

            git push

          fi
